<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | PRIYEXA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050811;
            color: #f7f8ff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #0a1020;
            border: 1px solid rgba(130,160,255,.20);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .logo span {
            color: #10a9ff;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #a7afc2;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid rgba(130,160,255,.25);
            background: #050811;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #10a9ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #10a9ff, #8b3dff);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: .9;
        }

        #resetMessage {
            text-align: center;
            color: #a7afc2;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #10a9ff;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="box">

        <div class="logo">
            PRIY<span>EXA</span>
        </div>

        <h1>Reset Password</h1>

        <p class="description" id="resetMessage">
            Verifying your password reset link...
        </p>

        <form id="resetForm" class="hidden">

            <label for="newPassword">
                New Password
            </label>

            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <button type="submit">
                Update Password →
            </button>

        </form>

        <a href="login.html" class="back">
            ← Back to Login
        </a>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        (() => {

            const SUPABASE_URL =
                "https://bubsyuriwcpxckdvkyvw.supabase.co";

            const SUPABASE_PUBLISHABLE_KEY =
                "sb_publishable_glf8AGc1dfHputcrnrvmDg_V8MqgpBp";

            const supabaseClient =
                window.supabase.createClient(
                    SUPABASE_URL,
                    SUPABASE_PUBLISHABLE_KEY
                );


            const resetForm =
                document.getElementById("resetForm");

            const resetMessage =
                document.getElementById("resetMessage");


            supabaseClient.auth.onAuthStateChange(
                async (event, session) => {

                    if (
                        event === "PASSWORD_RECOVERY" &&
                        session
                    ) {

                        resetMessage.textContent =
                            "Enter your new password below.";

                        resetForm.classList.remove("hidden");
                    }

                }
            );


            resetForm.addEventListener(
                "submit",
                async (e) => {

                    e.preventDefault();

                    const password =
                        document.getElementById(
                            "newPassword"
                        ).value;

                    const confirmPassword =
                        document.getElementById(
                            "confirmPassword"
                        ).value;


                    if (password !== confirmPassword) {

                        resetMessage.textContent =
                            "Passwords do not match.";

                        return;
                    }


                    resetMessage.textContent =
                        "Updating your password...";


                    const { error } =
                        await supabaseClient.auth.updateUser({
                            password: password
                        });


                    if (error) {

                        resetMessage.textContent =
                            error.message;

                        return;
                    }


                    resetMessage.textContent =
                        "Password updated successfully! Redirecting to login...";


                    setTimeout(() => {

                        window.location.href =
                            "login.html";

                    }, 1800);

                }
            );

        })();

    </script>

</body>
</html>
