<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | PRIYEXA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050811;
            color: #f7f8ff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: #0a1020;
            border: 1px solid rgba(130,160,255,.20);
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .logo span {
            color: #10a9ff;
        }

        h1 {
            text-align: center;
            margin-bottom: 12px;
        }

        #resetMessage {
            text-align: center;
            color: #a7afc2;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border-radius: 10px;
            border: 1px solid rgba(130,160,255,.25);
            background: #050811;
            color: white;
            outline: none;
        }

        input:focus {
            border-color: #10a9ff;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: linear-gradient(90deg, #10a9ff, #8b3dff);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #10a9ff;
            text-decoration: none;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="box">

    <div class="logo">
        PRIY<span>EXA</span>
    </div>

    <h1>Reset Password</h1>

    <p id="resetMessage">
        Verifying your password reset link...
    </p>

    <form id="resetForm" class="hidden">

        <label for="newPassword">
            New Password
        </label>

        <input
            type="password"
            id="newPassword"
            placeholder="Enter new password"
            minlength="8"
            required
        >

        <label for="confirmPassword">
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            minlength="8"
            required
        >

        <button type="submit">
            Update Password →
        </button>

    </form>

    <a href="login.html" class="back">
        ← Back to Login
    </a>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

(() => {

    const SUPABASE_URL =
        "https://bubsyuriwcpxckdvkyvw.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
        "sb_publishable_glf8AGc1dfHputcrnrvmDg_V8MqgpBp";

    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

    const form =
        document.getElementById("resetForm");

    const message =
        document.getElementById("resetMessage");


    function showPasswordForm() {

        message.textContent =
            "Enter your new password below.";

        form.classList.remove("hidden");
    }


    /*
     * Supabase recovery event
     */

    supabaseClient.auth.onAuthStateChange(
        (event, session) => {

            if (
                event === "PASSWORD_RECOVERY" &&
                session
            ) {
                showPasswordForm();
            }

        }
    );


    /*
     * Try to restore the recovery session
     * from the URL.
     */

    async function checkRecoverySession() {

        const hash =
            window.location.hash;

        if (hash.includes("access_token")) {

            const params =
                new URLSearchParams(
                    hash.substring(1)
                );

            const accessToken =
                params.get("access_token");

            const refreshToken =
                params.get("refresh_token");

            if (accessToken && refreshToken) {

                const { error } =
                    await supabaseClient.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                if (!error) {

                    showPasswordForm();
                    return;

                }
            }
        }


        /*
         * Check whether Supabase already
         * created a session.
         */

        const {
            data: { session }
        } =
            await supabaseClient.auth.getSession();


        if (session) {

            showPasswordForm();
            return;

        }


        message.textContent =
            "This password reset link is missing or has expired. Please request a new reset link.";

    }


    checkRecoverySession();


    /*
     * Update password
     */

    form.addEventListener(
        "submit",
        async (e) => {

            e.preventDefault();

            const password =
                document.getElementById(
                    "newPassword"
                ).value;

            const confirmPassword =
                document.getElementById(
                    "confirmPassword"
                ).value;


            if (password !== confirmPassword) {

                message.textContent =
                    "Passwords do not match.";

                return;
            }


            message.textContent =
                "Updating your password...";


            const { error } =
                await supabaseClient.auth.updateUser({
                    password: password
                });


            if (error) {

                message.textContent =
                    error.message;

                return;
            }


            message.textContent =
                "Password updated successfully! Redirecting...";


            setTimeout(() => {

                window.location.href =
                    "login.html";

            }, 1800);

        }
    );

})();

</script>

</body>
</html>
