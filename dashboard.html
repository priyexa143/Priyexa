<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PRIYEXA | Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .dashboard-page {
            min-height: 100vh;
            padding: 40px 20px;
        }

        .dashboard {
            max-width: 1100px;
            margin: auto;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .dashboard-header h1 {
            margin-bottom: 5px;
        }

        .dashboard-header p {
            color: var(--muted);
        }

        .logout-btn {
            cursor: pointer;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 25px;
        }

        .stat-card small {
            color: var(--muted);
        }

        .stat-card strong {
            display: block;
            font-size: 32px;
            margin-top: 10px;
        }

        .dashboard-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 25px;
        }

        .dashboard-card h2 {
            margin-top: 0;
        }

        .referral-box {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .referral-box input {
            flex: 1;
            min-width: 250px;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--line);
            background: #050811;
            color: var(--text);
        }

        .table-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid var(--line);
        }

        th {
            color: var(--muted);
        }

        #dashboardMessage {
            color: var(--muted);
            margin-bottom: 20px;
        }

        @media (max-width: 700px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="dashboard-page">

    <div class="dashboard">

        <div class="dashboard-header">
            <div>
                <p class="label">PRIYEXA PARTNER PORTAL</p>
                <h1>Welcome, <span id="userName">Partner</span></h1>
                <p id="dashboardMessage">Loading your dashboard...</p>
            </div>

            <button class="btn ghost logout-btn" id="logoutBtn">
                Logout
            </button>
        </div>

        <div class="stats-grid">

            <div class="stat-card">
                <small>Total Leads</small>
                <strong id="leadCount">0</strong>
            </div>

            <div class="stat-card">
                <small>Total Sales</small>
                <strong id="salesCount">0</strong>
            </div>

            <div class="stat-card">
                <small>Commission</small>
                <strong>₹<span id="commissionAmount">0</span></strong>
            </div>

        </div>

        <div class="dashboard-card">

            <h2>Your Referral Link</h2>

            <p>
                Share this link with potential customers.
            </p>

            <div class="referral-box">

                <input
                    type="text"
                    id="referralLink"
                    readonly
                >

                <button
                    class="btn primary"
                    id="copyReferral"
                >
                    Copy Link
                </button>

            </div>

        </div>

        <div class="dashboard-card">

            <h2>Your Leads</h2>

            <div class="table-wrap">

                <table>

                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Date</th>
                        </tr>
                    </thead>

                    <tbody id="leadsTable">
                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://bubsyuriwcpxckdvkyvw.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_glf8AGc1dfHputcrnrvmDg_V8MqgpBp";

const supabase = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

let currentUser = null;


// Check login
async function checkUser() {

    const {
        data: { user }
    } = await supabase.auth.getUser();

    if (!user) {
        window.location.href = "login.html";
        return;
    }

    currentUser = user;

    await loadDashboard();
}


// Load dashboard
async function loadDashboard() {

    const { data: profile, error: profileError } =
        await supabase
            .from("profiles")
            .select("full_name, role")
            .eq("id", currentUser.id)
            .single();

    if (profileError) {
        document.getElementById("dashboardMessage").textContent =
            profileError.message;
        return;
    }

    document.getElementById("userName").textContent =
        profile.full_name || currentUser.email;

    // Load partner record
    const { data: partner, error: partnerError } =
        await supabase
            .from("partners")
            .select("referral_code, status")
            .eq("id", currentUser.id)
            .single();

    if (partnerError) {

        document.getElementById("dashboardMessage").textContent =
            "Your partner account is waiting for admin setup.";

        return;
    }

    if (partner.status !== "active") {

        document.getElementById("dashboardMessage").textContent =
            "Your partner account is not active yet.";

        return;
    }

    document.getElementById("dashboardMessage").textContent =
        "Your PRIYEXA partner dashboard";

    // Referral link
    const referralLink =
        window.location.origin +
        window.location.pathname.replace(
            "dashboard.html",
            "index.html"
        ) +
        "?ref=" +
        partner.referral_code;

    document.getElementById("referralLink").value =
        referralLink;

    // Load leads
    const { data: leads } =
        await supabase
            .from("leads")
            .select("customer_name, service, status, created_at")
            .eq("partner_id", currentUser.id)
            .order("created_at", { ascending: false });

    document.getElementById("leadCount").textContent =
        leads ? leads.length : 0;

    const table = document.getElementById("leadsTable");

    table.innerHTML = "";

    if (!leads || leads.length === 0) {

        table.innerHTML =
            `<tr><td colspan="4">No leads yet.</td></tr>`;

        return;
    }

    leads.forEach(lead => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${lead.customer_name}</td>
            <td>${lead.service || "-"}</td>
            <td>${lead.status}</td>
            <td>${new Date(lead.created_at).toLocaleDateString()}</td>
        `;

        table.appendChild(row);
    });

}


// Copy referral link
document.getElementById("copyReferral")
    .addEventListener("click", async () => {

        const input =
            document.getElementById("referralLink");

        await navigator.clipboard.writeText(input.value);

        document.getElementById("copyReferral").textContent =
            "Copied!";

        setTimeout(() => {

            document.getElementById("copyReferral").textContent =
                "Copy Link";

        }, 2000);

    });


// Logout
document.getElementById("logoutBtn")
    .addEventListener("click", async () => {

        await supabase.auth.signOut();

        window.location.href = "login.html";

    });


// Start
checkUser();

</script>

</body>
</html>
